name: CI/CD Deployment to Hetzner

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installiere Root- und Frontend-Abhängigkeiten & baue Frontend
        run: |
          npm ci
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Kopiere Frontend-Build in den Backend-Public-Ordner
        run: |
          rm -rf backend/public
          mkdir -p backend/public
          cp -r frontend/dist/* backend/public/

      - name: Dateien auf Hetzner Webhosting hochladen (SCP)
        env:
          SSH_PASS: ${{ secrets.HETZNER_SSH_PASSWORD }}
          SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
          SSH_HOST: ${{ secrets.HETZNER_SSH_HOST }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          # Kopiert den Inhalt von backend/ direkt in das tatsächliche Arbeitsverzeichnis auf dem Server
          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -P 22 -r backend/. $SSH_USER@$SSH_HOST:~/meinprojekt/backend/

      - name: Befehle auf Hetzner Server ausführen (Migration & Install)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_SSH_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          password: ${{ secrets.HETZNER_SSH_PASSWORD }}
          port: 22
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/node/bin:/opt/node/bin
            
            # In das tatsächliche Arbeitsverzeichnis wechseln
            cd ~/meinprojekt/backend || exit 1
            
            echo "=== SYSTEM INFOS ==="
            pwd
            node -v || echo "node nicht gefunden"
            npm -v || echo "npm nicht gefunden"
            
            echo "=== RUNNING NPM CI ==="
            npm ci --omit=dev
            NPM_CI_STATUS=$?
            echo "npm ci beendet mit Status: $NPM_CI_STATUS"
            
            echo "=== RUNNING PRISMA GENERATE ==="
            npx prisma generate
            PRISMA_GEN_STATUS=$?
            echo "prisma generate beendet mit Status: $PRISMA_GEN_STATUS"
            
            echo "=== RUNNING PRISMA MIGRATE ==="
            npx prisma migrate deploy
            PRISMA_MIG_STATUS=$?
            echo "prisma migrate beendet mit Status: $PRISMA_MIG_STATUS"
            
            echo "=== RESTARTING PASSENGER ==="
            mkdir -p tmp
            touch tmp/restart.txt
            
            # Beende mit Fehler, falls ein Hauptschritt fehlgeschlagen ist
            if [ $NPM_CI_STATUS -ne 0 ] || [ $PRISMA_GEN_STATUS -ne 0 ] || [ $PRISMA_MIG_STATUS -ne 0 ]; then
              echo "=== DEPLOYMENT FEHLGESCHLAGEN! ==="
              exit 1
            fi
            echo "=== DEPLOYMENT ERFOLGREICH! ==="

